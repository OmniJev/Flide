name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.12,<2.15" --index-url https://download.pytorch.org/whl/cpu
          pip install .
      - name: Compile
        run: python -m compileall -q flide plugins demos tests
      - name: Import and load every model family
        run: |
          python -c "import flide; print('flide', flide.__version__)"
          python - <<'PY'
          from importlib.metadata import entry_points
          from flide import formats
          names = set(formats.names())
          plugins = {e.name for e in entry_points(group="flide.formats")}
          print(len(names), "formats:", ", ".join(sorted(names)))
          assert plugins <= names, f"plugins that did not load: {sorted(plugins - names)}"
          PY
          flide --help
      - name: Demo scripts
        run: |
          python demos/email_triage/make_requests.py --help
          python demos/email_triage/bench.py --help
