name: issue first

on:
  pull_request_target:
    types: [opened, reopened, edited]

permissions:
  issues: read
  pull-requests: write

jobs:
  accepted-issue:
    if: ${{ !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.state !== "open") return;
            const body = (pr.body || "").replace(/<!--[\s\S]*?-->/g, "");
            const refs = [...new Set([...body.matchAll(/(?<![\w/])#(\d+)/g)].map(m => Number(m[1])))];
            for (const n of refs) {
              try {
                const { data } = await github.rest.issues.get({ ...context.repo, issue_number: n });
                if (!data.pull_request && data.labels.some(l => l.name === "accepted")) return;
              } catch (e) {}
            }
            const guide = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md`;
            await github.rest.issues.createComment({
              ...context.repo, issue_number: pr.number,
              body: `Thanks for the pull request. Flide takes pull requests only for an issue a maintainer has accepted ` +
                    `(the \`accepted\` label), so this one is closed. Please open an issue first, or link the accepted ` +
                    `issue in the description, for example \`Fixes #12\`, and reopen. See [CONTRIBUTING](${guide}).`,
            });
            await github.rest.pulls.update({ ...context.repo, pull_number: pr.number, state: "closed" });
