name: Docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: the tag whose code goes into the image (default: the commit this runs on)
        required: false

env:
  IMAGE: omnijev/flide

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: ""
            alias: latest
            index: ""
            platforms: linux/amd64,linux/arm64
          - suffix: "-cu126"
            alias: cu126
            index: https://download.pytorch.org/whl/cu126
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          path: src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist src
      - name: Version
        id: v
        run: echo "version=$(python -c 'import tomllib; print(tomllib.load(open("src/pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      - name: Disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platforms }}
          build-args: TORCH_INDEX=${{ matrix.index }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}${{ matrix.suffix }}
            ${{ env.IMAGE }}:${{ matrix.alias }}
      - name: Smoke
        if: matrix.suffix == ''
        run: docker run --rm ${{ env.IMAGE }}:${{ steps.v.outputs.version }} --help
