name: Contributing guide

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check open pull requests
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner, repo: context.repo.repo, username: author,
            }).catch(() => ({ data: { permission: "none" } }));
            if (["admin", "maintain", "write"].includes(perm.permission)) return;
            const open = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const others = open.filter(p => p.user.login === author && p.number !== pr.number);
            if (others.length === 0) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number,
              body: `Thanks! Our review time is limited, so to keep the code quality high we review one open pull request ` +
                    `per contributor at a time (see CONTRIBUTING.md). You have #${others[0].number} open; please reopen ` +
                    `this one once that is closed.`,
            });
            await github.rest.pulls.update({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, state: "closed",
            });
